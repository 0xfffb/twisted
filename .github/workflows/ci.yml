name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom@27 要求 Node ^20.19 || ^22.12 || >=24
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rebuild public/runtime.js
        run: |
          rm -f public/runtime.js
          npm run build:pages
          test -f public/runtime.js
      - name: Smoke dump
        run: npm run cli -- dump example/fingerprint.js /tmp/twisted-dump
